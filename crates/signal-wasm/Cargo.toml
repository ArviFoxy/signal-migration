[package]
name = "signal-migration-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "WebAssembly bindings to the parts of libsignal that the browser page needs."

[lib]
crate-type = ["cdylib"]

[dependencies]
libsignal-protocol = { path = "../../third_party/libsignal/rust/protocol" }
libsignal-provisioning = { path = "../../third_party/libsignal/rust/provisioning" }
wasm-bindgen = "0.2"
rand = "0.9.4"
# getrandom has no default randomness source on wasm32-unknown-unknown; "wasm_js" uses the browser's crypto.getRandomValues.
getrandom = { version = "0.3", features = ["wasm_js"] }
# crypto-common (under libsignal's ciphers) uses getrandom 0.4, which needs the same feature.
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# ring and rustls's time type have no randomness or clock source on wasm32-unknown-unknown without these.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
libsignal-account-keys = { path = "../../third_party/libsignal/rust/account-keys" }
signal-crypto = { path = "../../third_party/libsignal/rust/crypto" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1.10"
js-sys = "0.3"
# The versions libsignal's workspace uses.
hkdf = "0.13.0"
sha2 = "0.11"
base64 = "0.22.1"
subtle = "2.6"

[profile.release]
opt-level = 3
lto = true
