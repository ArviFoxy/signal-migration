[package]
name = "signal-migration-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Serves the migration web app, relays its TLS tunnels to Signal, and keeps the sticker pack index."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
