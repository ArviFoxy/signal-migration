<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection diagnostics</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; color: #1b1b1f; background: #f4f4f1; }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  button { align-self: flex-start; min-height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: #3f3cbb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  pre { margin: 0; padding: 12px; background: #fff; border-radius: 8px; white-space: pre-wrap; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Connection diagnostics</h1>
  <button id="run" type="button">Check the connection to Signal</button>
  <button id="run-link" type="button">Link a device, log in with it, unlink it</button>
  <img id="qr" alt="QR code for linking a device" width="280" height="280" hidden>
  <pre id="out"></pre>
</main>
<script type="module" src="./diagnostics.js"></script>
</body>
</html>
