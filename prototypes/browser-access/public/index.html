<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser access tests</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; color: #1b1b1f; background: #f4f4f1; }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  section { background: #fff; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font-size: 24px; }
  h2 { margin: 0; font-size: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  input { font: 13px ui-monospace, monospace; padding: 8px 10px; border: 1px solid #c9cbd1; border-radius: 8px; }
  button { align-self: flex-start; min-height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: #3f3cbb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  pre { margin: 0; padding: 12px; background: #f4f4f1; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Browser access tests</h1>
  <section>
    <h2>1 · Sticker pack download from cdn-ca.signal.org</h2>
    <label>Pack ID <input id="pack-id" value="9acc9e8aba563d26a4994e69263e3b25"></label>
    <label>Pack key <input id="pack-key" value="5a6dff3948c28efb9b7aaf93ecc375c69fc316e78077ed26867a14d10a0f6a12"></label>
    <button id="run-sticker" type="button">Run</button>
    <pre id="out-sticker"></pre>
  </section>
  <section>
    <h2>2 · Provisioning WebSocket through Signal's reflectors</h2>
    <button id="run-provisioning" type="button">Run</button>
    <pre id="out-provisioning"></pre>
  </section>
  <section>
    <h2>3 · Link a device, log in with it, unlink it</h2>
    <button id="run-link" type="button">Run</button>
    <img id="link-qr" alt="QR code for linking a device" width="280" height="280" hidden>
    <pre id="out-link"></pre>
  </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
